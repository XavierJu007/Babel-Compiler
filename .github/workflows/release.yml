name: Release
# Builds cross-platform binaries, self-signed macOS DMGs, and publishes GitHub Releases.

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: babel-release
  cancel-in-progress: false

jobs:
  build-linux-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Read release version
        shell: bash
        run: |
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::VERSION must contain vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          echo "BABEL_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test source and UI
        run: |
          go mod download
          go mod verify
          go test ./... -count=1
          node --test babel-go/ui.test.cjs babel-go/ui-theme.test.cjs

      - name: Build Windows and Linux packages
        run: go run ./cmd/babel-release -commit "$GITHUB_SHA" -targets windows,linux -skip-checksums

      - name: Verify packaged Linux executable
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/babel-smoke"
          tar -xzf "dist/babel_${BABEL_RELEASE_VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/babel-smoke"
          binary="$RUNNER_TEMP/babel-smoke/babel"
          actual="$("$binary" -version)"
          [[ "$actual" == "Babel $BABEL_RELEASE_VERSION ($GITHUB_SHA, linux/amd64, "* ]]
          printf '%s\n' "$actual"
          BABEL_TEST_BINARY="$binary" go test ./internal/evalrun -run '^TestReal' -count=1 -v

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-windows
          path: dist/*
          if-no-files-found: error

  build-macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: true

      - name: Read release version
        shell: bash
        run: |
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::VERSION must contain vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          echo "BABEL_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build self-signed macOS CLI packages and DMG installers
        run: go run ./cmd/babel-release -commit "$GITHUB_SHA" -targets macos -macos-sign-id 6wyndoIin -dmg -skip-checksums

      - name: Verify macOS ARM64 signature and version
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/babel-mac-smoke"
          tar -xzf "dist/babel_${BABEL_RELEASE_VERSION}_macos_arm64.tar.gz" -C "$RUNNER_TEMP/babel-mac-smoke"
          binary="$RUNNER_TEMP/babel-mac-smoke/babel"
          codesign -dv --verbose=2 "$binary" 2>&1 | awk '/^Identifier=6wyndoIin$/{found=1} END{exit !found}'
          actual="$("$binary" -version)"
          [[ "$actual" == "Babel $BABEL_RELEASE_VERSION ($GITHUB_SHA, darwin/arm64, "* ]]
          printf '%s\n' "$actual"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read release version
        shell: bash
        run: |
          version="$(cat VERSION)"
          echo "BABEL_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate and verify SHA256SUMS
        shell: bash
        run: |
          cd dist
          LC_ALL=C ls -1 *.zip *.tar.gz *.dmg | xargs sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          refs="$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$BABEL_RELEASE_VERSION" --jq '.[].ref')"
          if printf '%s\n' "$refs" | grep -Fxq "refs/tags/$BABEL_RELEASE_VERSION"; then
            echo "::error::Tag already exists; choose a new VERSION. Nothing was overwritten."
            exit 1
          fi
          options=(--latest)
          if [[ "$BABEL_RELEASE_VERSION" == *-* ]]; then
            options=(--prerelease --latest=false)
          fi
          gh release create "$BABEL_RELEASE_VERSION" dist/*.zip dist/*.tar.gz dist/*.dmg dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Babel $BABEL_RELEASE_VERSION" \
            --notes-file .github/RELEASE_NOTES.md "${options[@]}"
